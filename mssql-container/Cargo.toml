[package]
name = "mssql-container"
version = "0.1.0"
edition = "2021"
description = "Pull and run SQL Server Linux containers without Docker, using Linux namespaces directly"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
nix = { version = "0.29", features = ["sched", "mount", "signal", "user", "fs", "hostname"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
hex = "0.4"
